[tool.poetry]
name = "aquamonitor"
version = "0.5.0"
description = "Python scripts to access Nivabasen through AquaMonitor API."
authors = ["Roar Brænden <roar.branden@niva.no>"]
license = "GPL-3.0"
readme = "README.md"
homepage = "https://github.com/NIVANorge/Aquamonitor-Python"
repository = "https://github.com/NIVANorge/Aquamonitor-Python"
keywords = ["Nivabasen", "Python", "AquaMonitor", "NIVA"]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
joblib = ">=1.5.3"
pandas = ">=3.0.2"
requests = ">=2.33.1"
yaspin = ">=3.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
